[package]
name = "rmux-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rmux"
path = "src/main.rs"

[dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }
glob = "=0.3.4"
notify = "=8.2.2"
netstat2 = "=0.11.2"
notify-rust = { version = "=4.18.2", features = ["preview-macos-un"] }
rmux-terminal = { path = "../rmux-terminal" }
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
futures-lite = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.3"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "=0.3.1"
objc = "=0.2.7"
raw-window-handle = "=0.6.2"
url = { version = "=2.5.8", optional = true }
wry = { version = "=0.57.3", default-features = false, features = ["os-webview"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[features]
browser = ["dep:wry", "dep:url"]
browser-probe = ["browser"]

[[example]]
name = "browser-probe"
path = "examples/browser_probe.rs"
required-features = ["browser-probe"]
